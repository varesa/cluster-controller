control-plane-samples:
  image: rust:1.90.0-bookworm
  stage: test
  timeout: 45 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
  variables:
    RUST_BACKTRACE: "1"
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential git clang llvm libclang-dev librados-dev librbd-dev libvirt-dev
      pkg-config libssl-dev openssl ca-certificates curl

    - export CONTROL_PLANE_BIN="$CI_PROJECT_DIR/control-plane-bin"
    - export CONTROL_PLANE_LOG_DIR="$CI_PROJECT_DIR/control-plane-logs"
    - mkdir -p "$CONTROL_PLANE_LOG_DIR"

    - bash ci/fetch-control-plane.sh "$CONTROL_PLANE_BIN" v1.24.2
    - test -x "$CONTROL_PLANE_BIN/etcd" && test -x "$CONTROL_PLANE_BIN/kube-apiserver"
  script:
    # Include the test which have been #[ignore]d due to requiring the control plane
    - 'cargo test --locked --bin cluster-controller integration_tests:: -- --ignored --nocapture'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - control-plane-logs/**/*.log
